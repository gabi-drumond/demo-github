# Pipeline de ejemplo para Azure DevOps (ADO) - idea -> produccion (.NET)
# Sesion "ADO + GitHub Copilot": Copilot genera el YAML y agrega, en vivo, un
# stage de analisis de seguridad (CodeQL) ANTES del Deploy.
# El gate de aprobacion manual se configura en el environment 'produccion' de ADO
# (Environments -> Approvals and checks), no en este archivo.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

stages:
  - stage: Build
    jobs:
      - job: build_test
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.0.x'
          - script: dotnet restore PortalAutorizacion.sln
            displayName: 'Restaurar dependencias'
          - script: dotnet build PortalAutorizacion.sln --no-restore -c $(buildConfiguration)
            displayName: 'Compilar'
          - script: dotnet test PortalAutorizacion.sln --no-build -c $(buildConfiguration)
            displayName: 'Ejecutar pruebas'
          - script: dotnet publish src/PortalAutorizacion/PortalAutorizacion.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)
            displayName: 'Publicar'
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: webapp

  - stage: Deploy
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: deploy_webapp
        environment: 'produccion'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Desplegando a Azure App Service (placeholder)"
                  displayName: 'Deploy (demo)'
