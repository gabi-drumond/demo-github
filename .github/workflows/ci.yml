name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PortalAutorizacion.sln
      - run: dotnet build PortalAutorizacion.sln --no-restore --configuration Release
      - run: dotnet test PortalAutorizacion.sln --no-build --configuration Release
